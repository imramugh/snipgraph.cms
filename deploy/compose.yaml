name: ${COMPOSE_PROJECT_NAME}

services:
  db:
    image: postgres:18.6-bookworm@sha256:1c59e2c3c818eaa0f0628f695b36e7c9e362d6b219b36a54a32df645cbd7e1af
    restart: unless-stopped
    environment:
      POSTGRES_DB: snipgraph_cms
      POSTGRES_USER: snipgraph
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snipgraph -d snipgraph_cms"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal

  web:
    image: ${CMS_IMAGE}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ${RUNTIME_ENV_FILE}
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: snipgraph_cms
      DB_USER: snipgraph
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      MIGRATE_ON_START: "true"
      NODE_ENV: production
    networks:
      internal:
      shared-net:
        aliases:
          - ${PROXY_ALIAS}

volumes:
  postgres-data:

networks:
  internal:
    internal: true
  shared-net:
    external: true
